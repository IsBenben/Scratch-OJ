<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Scratch OJ</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header>
      <h1>Scratch OJ</h1>
      <nav>
        <a href="#/">首页</a> | <a href="#/problems">题目列表</a> |
        <a href="#/submissions">提交记录</a>
      </nav>
    </header>

    <main>
      <section id="home" class="view">
        <h2>欢迎来到 Scratch OJ</h2>
        <p>面向计算思维培养的 Scratch 在线评测系统。</p>
        <p>请前往 <a href="#/problems">题目列表</a> 开始挑战。</p>
      </section>

      <section id="problemList" class="view" style="display: none">
        <h2>📚 题目列表</h2>
        <table id="problemTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>标题</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="problemTbody"></tbody>
        </table>
      </section>

      <section id="problemDetail" class="view" style="display: none">
        <h2 id="detailTitle"></h2>
        <div id="detailDescription"></div>
        <div id="detailSample"></div>
        <hr />
        <h3>📤 提交解答</h3>
        <form id="submitForm">
          <label
            >上传 .sb3 项目文件：<input
              type="file"
              id="projectFile"
              accept=".sb3"
              required
          /></label>
          <button type="submit">运行评测</button>
        </form>
        <div id="submitResult">
          <h4>📊 评测结果</h4>
          <p id="summary"></p>
          <table id="resultTable">
            <thead>
              <tr>
                <th>用例 #</th>
                <th>状态</th>
                <th>耗时 (ms)</th>
              </tr>
            </thead>
            <tbody id="resultTbody"></tbody>
          </table>
          <p id="submissionLink"></p>
        </div>
      </section>

      <section id="submissionList" class="view" style="display: none">
        <h2>📋 提交记录</h2>
        <div>
          <label
            >按题目过滤：
            <select id="filterProblem">
              <option value="">全部</option>
            </select>
          </label>
          <button id="refreshSubmissions">刷新</button>
        </div>
        <table id="submissionTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>题目</th>
              <th>状态</th>
              <th>提交时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="submissionTbody"></tbody>
        </table>
      </section>

      <section id="submissionDetail" class="view" style="display: none">
        <h2>提交 #<span id="submissionDetailId"></span></h2>
        <p><strong>题目：</strong><span id="submissionDetailProblem"></span></p>
        <p><strong>状态：</strong><span id="submissionDetailStatus"></span></p>
        <p>
          <strong>提交时间：</strong><span id="submissionDetailTime"></span>
        </p>
        <h3>评测详情</h3>
        <table>
          <thead>
            <tr>
              <th>用例 #</th>
              <th>状态</th>
              <th>耗时 (ms)</th>
            </tr>
          </thead>
          <tbody id="submissionDetailTbody"></tbody>
        </table>
      </section>
    </main>

    <script src="utils.js"></script>
    <script src="index.js"></script>
  </body>
</html>
